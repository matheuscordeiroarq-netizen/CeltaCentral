name: Compilar Celta Central

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Instalar XcodeGen
        run: brew install xcodegen

      - name: Gerar projeto Xcode
        run: xcodegen generate

      - name: Testar compilacao no simulador
        run: |
          xcodebuild \
            -project CeltaCentral.xcodeproj \
            -scheme CeltaCentral \
            -sdk iphonesimulator \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Compilar para iPad fisico sem assinatura
        run: |
          xcodebuild \
            -project CeltaCentral.xcodeproj \
            -scheme CeltaCentral \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build-device \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Criar pacote para assinatura
        run: |
          APP_PATH=$(find build-device -name "CeltaCentral.app" -type d | head -1)

          if [ -z "$APP_PATH" ]; then
            echo "CeltaCentral.app nao encontrado"
            exit 1
          fi

          mkdir -p Payload
          cp -R "$APP_PATH" Payload/CeltaCentral.app
          zip -r CeltaCentral-Unsigned.ipa Payload

      - name: Salvar IPA
        uses: actions/upload-artifact@v4
        with:
          name: CeltaCentral-iPad-Unsigned
          path: CeltaCentral-Unsigned.ipa
